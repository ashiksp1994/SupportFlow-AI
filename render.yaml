# ==============================================================================
# SupportFlow AI — Render Cloud Blueprint (render.yaml)
# Target: Render Free Web Service + Neon Serverless PostgreSQL 17 (pgvector)
# ==============================================================================
services:
  - type: web
    name: supportflow-ai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false # Set to Neon JDBC URL: jdbc:postgresql://<ep>.neon.tech/neondb?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false # Set to Vercel frontend URL: https://supportflow-ai.vercel.app
      - key: APP_DEMO_SEED_ENABLED
        value: "false" # Set to "true" or include "demo" in SPRING_PROFILES_ACTIVE only when seeding portfolio demo data
      - key: DB_POOL_MAX_SIZE
        value: "5"
      - key: DB_POOL_MIN_IDLE
        value: "1"
