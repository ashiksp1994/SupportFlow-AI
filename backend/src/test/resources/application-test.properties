# H2 In-Memory Database Configuration (PostgreSQL Compatibility Mode)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Flyway Configuration for Unit & Slice Tests
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=false

# Test-Only JWT Configuration (256-bit Base64 test key — NOT a real secret)
jwt.secret=VGVzdE9ubHlKd3RTZWNyZXRLZXlGb3JTdXBwb3J0Rmxvd0FJUnitVGVzdHMyNTZCaXRzTG9uZw==
jwt.expirationMs=3600000

# CORS Origins for Tests
app.cors.allowed-origins=http://localhost:5173
# Disable automatic demo data seeder in unit/slice tests so tests control their own fixtures
app.demo.seed-enabled=false
