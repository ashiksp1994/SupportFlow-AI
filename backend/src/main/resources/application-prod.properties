# ==============================================================================
# SupportFlow AI — Production Profile Configuration (Render + Neon PostgreSQL)
# Activate with: SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Neon Serverless PostgreSQL 17 + pgvector (SSL required, conservative pool for free tier)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=600000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Security: JWT_SECRET must be explicitly injected via environment variable in prod (no fallback!)
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
security.auth.max-login-attempts-per-minute=${AUTH_MAX_LOGIN_ATTEMPTS_PER_MINUTE:8}

# Disable demo account seeding by default in production unless explicitly enabled for portfolio demo
app.demo.seed-enabled=${APP_DEMO_SEED_ENABLED:false}

# CORS origins (set to Vercel deployment domain)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Optional LLM Provider Configuration (falls back to grounded local engine when API key is blank)
app.ai.llm.provider=${AI_LLM_PROVIDER:local-grounded}
app.ai.llm.base-url=${AI_LLM_BASE_URL:https://api.openai.com/v1}
app.ai.llm.api-key=${AI_LLM_API_KEY:}
app.ai.llm.model=${AI_LLM_MODEL:gpt-4o-mini}
app.ai.rag.min-relevance-threshold=${AI_RAG_MIN_RELEVANCE:0.25}

# Observability & Health Probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
logging.pattern.level=%5p [corrId=%X{correlationId:-none}]
