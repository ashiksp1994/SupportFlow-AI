# ==============================================================================
# SupportFlow AI — Self-Contained Live Demo Profile
# Runs with embedded H2 (PostgreSQL Compatibility Mode), Flyway migrations, and
# realistic pre-seeded Enterprise support tickets, RAG articles, and AI approvals.
# ==============================================================================
spring.datasource.url=jdbc:h2:mem:supportflow_live;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.demo.seed-enabled=true
