# ==============================================================================
# SupportFlow AI — Backend Configuration
# All sensitive values are injected via environment variables in production.
# Local defaults are provided strictly for local development convenience.
# ==============================================================================

spring.application.name=supportflow-backend
server.port=${SERVER_PORT:8080}

# PostgreSQL Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/supportflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:supportflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:supportflow_dev_only}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Flyway Database Migrations
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Configuration (Must be at least 256-bit Base64-encoded secret in production)
jwt.secret=${JWT_SECRET:U3VwcG9ydEZsb3dBSURldk9ubHlKd3RTZWNyZXRLZXlNdXN0QmVSZXBsYWNlZEluUHJvZHVjdGlvbjI1NkJpdHM=}
jwt.expirationMs=${JWT_EXPIRATION_MS:3600000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Demo data seeding is disabled by default; activate with SPRING_PROFILES_ACTIVE=demo or APP_DEMO_SEED_ENABLED=true
app.demo.seed-enabled=${APP_DEMO_SEED_ENABLED:false}

# Actuator Health & Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
