plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.ben-manes.versions' version '0.67.0'
    id 'jvm-test-suite'
    id 'jacoco'
}

group = 'com.supportflow'
version = '0.1.0-SNAPSHOT'
description = 'SupportFlow AI — Modular Monolith Backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springModulithVersion', '2.1.2')
    set('jjwtVersion', '0.12.6')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
    }
}

dependencies {
    // Spring Boot core starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'

    // Spring Modulith for module boundary verification
    implementation 'org.springframework.modulith:spring-modulith-starter-core'

    // Database & Flyway migrations
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // JWT Authentication
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Unit & slice testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

testing {
    suites {
        test {
            useJUnitJupiter()
            targets {
                all {
                    testTask.configure {
                        systemProperty 'spring.profiles.active', 'test'
                    }
                }
            }
        }

        integrationTest(JvmTestSuite) {
            useJUnitJupiter()
            dependencies {
                implementation project()
                implementation 'org.springframework.boot:spring-boot-starter-test'
                implementation 'org.springframework.boot:spring-boot-testcontainers'
                implementation 'org.testcontainers:testcontainers-junit-jupiter'
                implementation 'org.testcontainers:testcontainers-postgresql'
                runtimeOnly 'com.h2database:h2'
            }
            targets {
                all {
                    testTask.configure {
                        systemProperty 'spring.profiles.active', 'integration'
                        shouldRunAfter(tasks.named('test'))
                    }
                }
            }
        }
    }
}

configurations.named('integrationTestImplementation') {
    extendsFrom(configurations.implementation, configurations.testImplementation)
}
configurations.named('integrationTestRuntimeOnly') {
    extendsFrom(configurations.runtimeOnly, configurations.testRuntimeOnly)
}

tasks.named('check') {
    dependsOn(testing.suites.integrationTest)
    dependsOn(tasks.named('jacocoTestReport'))
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn(tasks.named('test'))
    reports {
        xml.required = true
        html.required = true
    }
}
