# ==============================================================================
# SupportFlow AI — Full Cloud-Neutral Local Stack (Podman & Docker Compatible)
# Services: PostgreSQL 17 (pgvector), Redis, MinIO (S3), Backend, and Frontend
# ==============================================================================

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: supportflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supportflow}
      POSTGRES_USER: ${POSTGRES_USER:-supportflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportflow_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - supportflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supportflow} -d ${POSTGRES_DB:-supportflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: supportflow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"

  minio:
    image: minio/minio:latest
    container_name: supportflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-supportflow_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-supportflow_minio_dev_only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - supportflow_miniodata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supportflow-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-supportflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-supportflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-supportflow_dev_only}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:-U3VwcG9ydEZsb3dBSURldk9ubHlKd3RTZWNyZXRLZXlNdXN0QmVSZXBsYWNlZEluUHJvZHVjdGlvbjI1NkJpdHM=}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supportflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  supportflow_pgdata:
  supportflow_miniodata:
