# ==============================================================================
# SupportFlow AI — Local Development & Podman / Docker Compose Stack
# Core services (postgres, backend, frontend) start by default.
# Optional infrastructure (redis, minio) can be started with:
#   podman compose --profile full-infra up -d
# ==============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: supportflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supportflow}
      POSTGRES_USER: ${POSTGRES_USER:-supportflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportflow_dev_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supportflow} -d ${POSTGRES_DB:-supportflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supportflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-supportflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-supportflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-supportflow_dev_pass}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      JWT_SECRET: ${JWT_SECRET:-U3VwcG9ydEZsb3dBSURldk9ubHlGYWxsYmFja1NlY3JldEtleUZvckxvY2FsVGVzdGluZzIwMjY=}
      APP_DEMO_SEED_ENABLED: ${APP_DEMO_SEED_ENABLED:-true}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supportflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  redis:
    image: redis:7.4-alpine
    container_name: supportflow-redis
    profiles: ["full-infra"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: supportflow-minio
    profiles: ["full-infra"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-supportflow_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-supportflow_minio_pass}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
